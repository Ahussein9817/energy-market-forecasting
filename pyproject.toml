[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-market-forecasting"
version = "0.1.0"
description = "NYISO day-ahead price forecasting: research backtests (src) and an operational service (energy_service)"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
energy = "energy_service.cli:main"

[tool.setuptools]
packages = ["src", "energy_service", "energy_service.ingest"]

[tool.setuptools.package-data]
energy_service = ["migrations/*.sql"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
