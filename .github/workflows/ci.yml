name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q  # offline: network calls are mocked
      - name: Metrics regenerate from the committed predictions (exits 1 if they differ)
        run: python scripts/evaluate_predictions.py
      - name: Forecast-weather metrics regenerate from the committed predictions (exits 1 if they differ)
        run: python scripts/evaluate_forecast_weather.py
      - name: Operational backtest metrics and serving decision regenerate (exits 1 if they differ)
        run: python scripts/evaluate_operational.py
      - name: Service smoke test (schema migrates, status runs offline)
        env:
          ENERGY_DB_PATH: ${{ runner.temp }}/smoke.sqlite
        run: |
          python -m energy_service db-init
          python -m energy_service status
