name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas==3.1.1 numpy==2.5.4 requests==2.34.2 pyarrow==26.0.1 -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q  # offline: network calls are mocked
